  <text x="95" y="1065" font-family="Arial, sans-serif" font-size="13" fill="#78350f">1. Excessive 14,200 kWh drawn during Zone D peak incurred ₹21,300 avoidable MSEDCL surcharge.</text>
  <text x="95" y="1090" font-family="Arial, sans-serif" font-size="13" fill="#78350f">2. Night off-peak rebate (Zone E) underutilized at only 10.3%. Shifting BESS &amp; EV load yields ₹23,400/mo.</text>

  <!-- Footer -->
