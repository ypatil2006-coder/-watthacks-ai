  <text x="490" y="745" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">+₹1.50 / kWh</text>
  <text x="660" y="745" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">14,200</text>
  <text x="810" y="745" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">+₹21,300.00</text>
